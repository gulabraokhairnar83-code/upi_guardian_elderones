# =============================================================================
# UPI GUARDIAN - LOCAL DEVELOPMENT & TESTING DOCKER COMPOSE CONFIGURATION
# =============================================================================
# NOTE: THIS FILE IS FOR LOCAL DEVELOPMENT AND TESTING CONVENIENCE ONLY.
# IT IS NOT INTENDED FOR PRODUCTION CLOUD INFRASTRUCTURE DEPLOYMENT.
#
# Production deployments should utilize managed container runtimes (e.g. Render,
# AWS ECS, Cloud Run) alongside MongoDB Atlas with restricted IP allowlists.
# =============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upi-guardian-backend-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - PORT=5000
      - HOST=0.0.0.0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      - MONGODB_URI=${MONGODB_URI:-}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-upi_guardian_dev}
      - USE_MOCK_DB=${USE_MOCK_DB:-true}
      - TWILIO_ENABLED=${TWILIO_ENABLED:-false}
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend-magic-wand-07-main
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api
        - VITE_USE_MOCK_API=false
    container_name: upi-guardian-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
